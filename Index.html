
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .chat-container {
            max-width: 700px;
            margin: 25px auto;
            padding: 15px;
        }

        #messages {
            background: white;
            min-height: 400px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ddd;
            overflow-y: auto;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .bot {
            background: #e5e7eb;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            min-width: 0;
        }

        button {
            padding: 14px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Buddy AI</h1>
        <p>Your Smart AI Assistant</p>
    </header>

    <main class="chat-container">

        <div id="messages">
            <div class="message bot">
                Hello! I am Buddy AI. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Message Buddy AI..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </main>

    <script>
        function sendMessage() {
            const input = document.getElementById("userInput");
            const messages = document.getElementById("messages");

            const text = input.value.trim();

            if (!text) return;

            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = text;

            messages.appendChild(userMessage);

            input.value = "";

            const botMessage = document.createElement("div");
            botMessage.className = "message bot";
            botMessage.textContent =
                "Hello! Buddy AI is ready. AI connection will be added soon.";

            messages.appendChild(botMessage);

            messages.scrollTop = messages.scrollHeight;
        }
    </script>

</body>
</html>
<style>
  #buddy-chat {
    max-width: 500px;
    margin: 25px auto;
    padding: 16px;
    background: #ffffff;
    border-radius: 16px;
    font-family: Arial, sans-serif;
    box-shadow: 0 2px 12px #0002;
  }

  #buddy-chat h2 {
    text-align: center;
    color: #2563eb;
  }

  #buddy-messages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
    background: #f1f5f9;
    border-radius: 10px;
  }

  .buddy-message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    background: #dbeafe;
  }

  .user-message {
    background: #dcfce7;
    text-align: right;
  }

  #buddy-input {
    width: 70%;
    padding: 12px;
    margin-top: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #buddy-send {
    padding: 12px;
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 8px;
  }
</style>

<div id="buddy-chat">
  <h2>Buddy AI</h2>
  <div id="buddy-messages">
    <div class="buddy-message">
      Hello! Welcome to Buddy AI.
    </div>
  </div>

  <input id="buddy-input" type="text"
    placeholder="Type your message...">

  <button id="buddy-send">Send</button>
</div>

<script>
  const input = document.getElementById("buddy-input");
  const messages = document.getElementById("buddy-messages");
  const send = document.getElementById("buddy-send");

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const userMessage = document.createElement("div");
    userMessage.className = "buddy-message user-message";
    userMessage.textContent = text;
    messages.appendChild(userMessage);

    const reply = document.createElement("div");
    reply.className = "buddy-message";
    reply.textContent =
      "Hello! I am Buddy AI. Your AI connection will be added soon.";
    messages.appendChild(reply);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
  }

  send.addEventListener("click", sendMessage);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
  });
</script>
