
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9edef;
}
header {
  background: #075e54;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 24px;
}
#messages {
  height: 75vh;
  overflow-y: auto;
  padding: 15px;
}
.message {
  background: white;
  padding: 12px;
  margin: 10px;
  border-radius: 12px;
  width: fit-content;
}
.user {
  background: #dcf8c6;
  margin-left: auto;
}
footer {
  display: flex;
  padding: 10px;
  background: white;
}
input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: 1px solid gray;
}
button {
  background: #075e54;
  color: white;
  border: none;
  padding: 12px;
  margin-left: 8px;
  border-radius: 20px;
}
</style>
</head>
<body>
<header>My AI Chat</header>
<div id="messages">
<div class="message">Hello! Welcome to AI Chat.</div>
</div>
<footer>
<input id="msg" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</footer>
<script>
function sendMessage() {
  let input = document.getElementById("msg");
  let text = input.value.trim();
  if (!text) return;
  let message = document.createElement("div");
  message.className = "message user";
  message.textContent = text;
  document.getElementById("messages").appendChild(message);
  input.value = "";
}
</script>
</body>
</html>
