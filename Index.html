
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .chat-container {
            max-width: 700px;
            margin: 25px auto;
            padding: 15px;
        }

        #messages {
            background: white;
            min-height: 400px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ddd;
            overflow-y: auto;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .bot {
            background: #e5e7eb;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            min-width: 0;
        }

        button {
            padding: 14px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Buddy AI</h1>
        <p>Your Smart AI Assistant</p>
    </header>

    <main class="chat-container">

        <div id="messages">
            <div class="message bot">
                Hello! I am Buddy AI. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Message Buddy AI..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </main>

    <script>
        function sendMessage() {
            const input = document.getElementById("userInput");
            const messages = document.getElementById("messages");

            const text = input.value.trim();

            if (!text) return;

            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = text;

            messages.appendChild(userMessage);

            input.value = "";

            const botMessage = document.createElement("div");
            botMessage.className = "message bot";
            botMessage.textContent =
                "Hello! Buddy AI is ready. AI connection will be added soon.";

            messages.appendChild(botMessage);

            messages.scrollTop = messages.scrollHeight;
        }
    </script>

</body>
</html>
