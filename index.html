
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>Buddy AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f7ff;
  color: #172033;
  height: 100vh;
  overflow: hidden;
}

:root {
  --blue: #2563eb;
  --dark-blue: #1746a2;
  --light-blue: #eaf1ff;
  --white: #ffffff;
  --text: #172033;
}
</style>
</head>
<body>

<div class="app">

  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <span class="brand-icon">🤖</span>
      <span>Buddy AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      + New Chat
    </button>

    <div class="history-title">Recent Chats</div>
    <div id="chatHistory"></div>

    <div class="sidebar-bottom">
      <button onclick="openSettings()">⚙ Settings</button>
    </div>

  </aside>

  <!-- Main Chat Area -->
  <main class="main">

    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="top-title">Buddy AI</div>

      <button class="profile-btn" onclick="openSettings()">
        ⚙
      </button>
    </header>

    <section class="chat-area" id="chatArea">

      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>Hello! I'm Buddy AI</h2>
        <p>How can I help you today?</p>
      </div>

      <div id="messages"></div>

    </section>

  </main>

</div>
  
<!-- Message Composer -->
<div class="composer">

  <textarea
    id="messageInput"
    placeholder="Message Buddy AI..."
    rows="1"
    onkeydown="handleEnter(event)"
  ></textarea>

  <button
    class="send-btn"
    id="sendBtn"
    onclick="sendMessage()"
    title="Send Message"
  >
    ➤
  </button>

</div>
  
<!-- Alarm and Reminder Section -->
<section class="reminder-section" id="reminderSection">

  <h2>⏰ Buddy Reminders</h2>

  <input
    type="text"
    id="reminderTitle"
    placeholder="Reminder का नाम लिखो"
  >

  <select id="reminderType">
    <option value="daily">Daily</option>
    <option value="office">Office</option>
    <option value="university">University</option>
    <option value="birthday">Birthday</option>
    <option value="meeting">Meeting</option>
    <option value="anniversary">Anniversary</option>
    <option value="custom">Custom</option>
  </select>

  <input type="date" id="reminderDate">

  <input type="time" id="reminderTime">

  <button onclick="addReminder()">
    + Add Reminder
  </button>

  <div id="reminderList"></div>

</section>
  
<script>
// Buddy AI Main JavaScript

let chats = [];
let currentChatId = Date.now();

const API_URL = "https://buddy-ai-1.onrender.com/chat";

function setStatus(message) {
  const status = document.getElementById("status");
  if (status) status.textContent = message;
}

function addMessage(text, sender) {
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");

  if (welcome) welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message " + sender;
  message.textContent = text;

  messages.appendChild(message);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setStatus("Buddy is thinking...");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    const reply =
      data.reply ||
      data.response ||
      data.message ||
      "मुझे जवाब नहीं मिला।";

    addMessage(reply, "assistant");

  } catch (error) {
    addMessage(
      "AI से कनेक्शन नहीं हो पाया। सर्वर की जाँच करें।",
      "assistant"
    );
    console.error(error);
  }

  setStatus("");
}

function handleEnter(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function newChat() {
  document.getElementById("messages").innerHTML = "";
  document.getElementById("welcome").style.display = "block";
  currentChatId = Date.now();
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("active");
}

function openSettings() {
  alert("Buddy AI Settings");
}
</script>
  
<script>
// PART 6 - BUDDY AI VOICE SYSTEM

const composer = document.querySelector(".composer");

if (composer && !document.getElementById("micBtn")) {
  const mic = document.createElement("button");
  mic.id = "micBtn";
  mic.type = "button";
  mic.textContent = "🎤";
  mic.title = "Speak to Buddy";

  mic.style.cssText =
    "padding:12px;border:0;border-radius:50%;background:#dbeafe;font-size:20px;cursor:pointer;";

  composer.insertBefore(mic, composer.querySelector("#sendBtn"));
  mic.addEventListener("click", startVoice);
}

// Voice greeting
function openBuddyVoice() {
  speakReply("Hello Buddy");
}

// Speech recognition
function startVoice() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    alert("Voice recognition is not supported in this browser.");
    return;
  }

  const recognition = new Speech();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;

  recognition.onstart = () => {
    setStatus("Buddy is listening...");
  };

  recognition.onresult = (event) => {
    const spokenText =
      event.results[0][0].transcript;

    document.getElementById("messageInput").value =
      spokenText;

    sendMessage();
  };

  recognition.onerror = () => {
    setStatus("Microphone error");
  };

  recognition.onend = () => {
    setStatus("");
  };

  recognition.start();
}

// AI voice reply
function speakReply(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "hi-IN";
  voice.rate = 1;
  voice.pitch = 1;

  window.speechSynthesis.speak(voice);
}

// Stop AI voice
function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}
</script>
  
<script>
// PART 7 - VOICE CONTROL

let buddyListening = false;
let voiceRecognition = null;

function startBuddyListening() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    setStatus("Voice supported नहीं है");
    return;
  }

  if (buddyListening) return;

  voiceRecognition = new Speech();
  voiceRecognition.lang = "hi-IN";
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = true;

  buddyListening = true;

  voiceRecognition.onresult = function(event) {
    const result =
      event.results[event.results.length - 1];

    const spoken = result[0].transcript
      .trim()
      .toLowerCase();

    if (
      spoken.includes("रुक जाओ") ||
      spoken.includes("चुप हो जाओ") ||
      spoken.includes("stop")
    ) {
      stopBuddy();
      return;
    }

    if (result.isFinal) {
      document.getElementById("messageInput").value =
        result[0].transcript;

      sendMessage();
    }
  };

  voiceRecognition.onend = function() {
    buddyListening = false;
  };

  voiceRecognition.onerror = function() {
    buddyListening = false;
    setStatus("Microphone बंद हो गया");
  };

  voiceRecognition.start();
}

function stopBuddy() {
  stopSpeaking();

  if (voiceRecognition) {
    voiceRecognition.stop();
  }

  buddyListening = false;
  setStatus("Buddy रुक गया");
}

</script>

<!-- PART 8 - CHAT HISTORY AREA -->
<div class="history-item" id="historyItem">
  <button onclick="newChat()">＋ नई चैट</button>
</div>

  
<!-- PART 9 - NEW CHAT FUNCTION -->
<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("messageInput");

  if (messages) {
    messages.innerHTML = "";
  }

  if (input) {
    input.value = "";
  }

  currentChatId = Date.now();
  setStatus("नई चैट शुरू हो गई");
}
</script>

  
<!-- PART 10 - FINAL SETUP -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("messageInput");

  if (input) {
    input.focus();
  }
});

function handleEnter(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}
</script>
