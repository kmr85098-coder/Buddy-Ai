<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Buddy AI</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
  color: #202123;
}
.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}
  .sidebar {
  width: 260px;
  background: #f7f7f8;
  border-right: 1px solid #eee;
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 25px;
}
.logo {
  width: 40px;
  height: 40px;
  background: #2563eb;
  color: white;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 24px;
}
button {
  cursor: pointer;
}
.newchat {
  padding: 13px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  text-align: left;
  font-size: 15px;
  margin-bottom: 22px;
}
.history-title {
  font-size: 12px;
  color: #777;
  margin-bottom: 10px;
}
.history {
  overflow-y: auto;
  flex: 1;
}
.history-item {
  padding: 11px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 4px;
}
.history-item.active,
.history-item:hover {
  background: #e5e5e5;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.topbar {
  height: 65px;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 12px;
}
.menu-btn {
  border: 0;
  background: transparent;
  font-size: 23px;
}
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
}
.welcome {
  text-align: center;
  margin: 15vh auto 0;
  max-width: 500px;
}
.welcome h1 {
  font-size: 30px;
}
.message {
  max-width: 800px;
  margin: 18px auto;
  padding: 14px 17px;
  border-radius: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user-message {
  background: #eaf2ff;
  margin-right: max(0px, calc((100% - 800px) / 2));
}
.ai-message {
  background: #f5f5f5;
  margin-left: max(0px, calc((100% - 800px) / 2));
}
.composer {
  padding: 15px;
  border-top: 1px solid #eee;
  display: flex;
  gap: 10px;
  max-width: 850px;
  width: 100%;
  margin: auto;
}
.composer textarea {
  flex: 1;
  resize: none;
  min-height: 48px;
  max-height: 120px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 13px;
  font: inherit;
  outline: none;
}
.send-btn, .mic-btn {
  border: 0;
  border-radius: 12px;
  padding: 0 16px;
  background: #2563eb;
  color: white;
  font-size: 18px;
}
@media (max-width: 650px) {
  .sidebar {
    position: fixed;
    z-index: 5;
    left: -270px;
    top: 0;
    bottom: 0;
    transition: left .2s;
  }
  .sidebar.open {
    left: 0;
  }
  .main {
    width: 100%;
  }
  .chat-area {
    padding: 12px;
  }
  .welcome h1 {
    font-size: 24px;
  }
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🤖</div>
      <span>Buddy AI</span>
    </div>

    <button class="newchat" onclick="createChat()">
      + New Chat
    </button>

    <div class="history-title">CHAT HISTORY</div>
    <div class="history" id="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <strong>Buddy AI</strong>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <h1>Hello! 👋</h1>
        <p>मैं Buddy AI हूँ। आज मैं आपकी क्या मदद करूँ?</p>
      </div>
      <div id="messages"></div>
    </section>

    <div class="composer">
      <button class="mic-btn" onclick="startVoice()">🎤</button>
      <textarea id="messageInput"
        placeholder="अपना मैसेज लिखें..."
        rows="1"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </main>

</div>
<script>
const API_URL = "https://buddy-ai-1.onrender.com/chat";
const STORAGE_KEY = "buddyChatsV1";
const CURRENT_KEY = "buddyCurrentChatV1";

let chats = {};
let currentChatId = "";

function makeId() {
  return Date.now().toString() + Math.random().toString(36).slice(2);
}

function saveChats() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  localStorage.setItem(CURRENT_KEY, currentChatId);
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    chats = {};
  }

  currentChatId = localStorage.getItem(CURRENT_KEY) || "";

  if (!currentChatId || !chats[currentChatId]) {
    createChat();
  } else {
    render();
  }
}

function createChat() {
  currentChatId = makeId();

  chats[currentChatId] = {
    id: currentChatId,
    title: "नई चैट",
    messages: []
  };

  saveChats();
  render();
  closeSidebar();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.replaceChildren();

  Object.values(chats)
    .reverse()
    .forEach(chat => {
      const item = document.createElement("div");
      item.className = "history-item" +
        (chat.id === currentChatId ? " active" : "");
      item.textContent = chat.title;
      item.onclick = () => {
        currentChatId = chat.id;
        saveChats();
        render();
        closeSidebar();
      };
      history.appendChild(item);
    });
}

function render() {
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");

  messages.replaceChildren();

  const chat = chats[currentChatId];
  if (!chat) return;

  welcome.style.display =
    chat.messages.length ? "none" : "block";

  chat.messages.forEach(msg => {
    const div = document.createElement("div");
    div.className = "message " +
      (msg.role === "user" ? "user-message" : "ai-message");
    div.textContent = msg.text;
    messages.appendChild(div);
  });

  renderHistory();

  const area = document.getElementById("chatArea");
  area.scrollTop = area.scrollHeight;
}

function addMessage(role, text) {
  chats[currentChatId].messages.push({ role, text });

  if (role === "user" &&
      chats[currentChatId].messages.length === 1) {
    chats[currentChatId].title = text.slice(0, 25);
  }

  saveChats();
  render();
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  input.value = "";
  addMessage("user", text);

  const sendButton = document.querySelector(".send-btn");
  sendButton.disabled = true;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        chatId: currentChatId
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI server error");
    }

    const reply = data.reply || data.response;

    if (!reply) {
      throw new Error("AI का जवाब नहीं मिला");
    }

    addMessage("assistant", reply);
