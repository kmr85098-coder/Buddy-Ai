
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddy AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #212121;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #383838;
}

header h2 {
  font-size: 21px;
}

#newChat {
  background: #333;
  color: white;
  border: 1px solid #555;
  padding: 9px 13px;
  border-radius: 20px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  padding: 13px 16px;
  border-radius: 16px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user {
  background: #303030;
  align-self: flex-end;
}

.bot {
  background: #262626;
  align-self: flex-start;
}

#bottom {
  padding: 12px;
  border-top: 1px solid #383838;
}

#inputBox {
  background: #303030;
  border: 1px solid #555;
  border-radius: 25px;
  display: flex;
  align-items: center;
  padding: 7px;
  gap: 6px;
}

#message {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 10px;
  font-size: 16px;
  min-width: 0;
}

button {
  cursor: pointer;
  border: none;
  color: white;
  background: #444;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 18px;
}

#send {
  background: white;
  color: black;
}

#status {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  padding-top: 8px;
}
</style>
</head>

<body>

<header>
  <h2>Buddy AI</h2>
  <button id="newChat">＋ New</button>
</header>

<div id="chat">
  <div class="message bot">
    Hello! Welcome to Buddy AI.
    How can I help you today?
  </div>
</div>

<div id="bottom">
  <div id="inputBox">
    <button id="mic" title="Voice">🎤</button>

    <input
      id="message"
      type="text"
      placeholder="Message Buddy AI..."
    >

    <button id="send">➤</button>
  </div>
  <div id="status">Buddy AI is ready</div>
</div>

<script>
const chat = document.getElementById("chat");
const message = document.getElementById("message");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const statusText = document.getElementById("status");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = message.value.trim();

  if (!text) return;

  addMessage(text, "user");
  message.value = "";
  statusText.textContent = "Buddy AI is thinking...";

  try {
    const response = await fetch(
      "https://buddy-ai-1.onrender.com/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    const reply = data.reply || data.response;

    if (!reply) {
      throw new Error("No AI reply received");
    }

    addMessage(reply, "bot");

    const speech = new SpeechSynthesisUtterance(reply);
    speech.lang = "hi-IN";
    speechSynthesis.speak(speech);

    statusText.textContent = "Buddy AI is ready";

  } catch (error) {
    addMessage(
      "Connection problem: " + error.message,
      "bot"
    );
    statusText.textContent = "Connection error";
  }
}

send.addEventListener("click", sendMessage);

message.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

mic.addEventListener("click", function() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    statusText.textContent =
      "Voice recognition is not supported";
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "hi-IN";
  recognition.start();

  statusText.textContent = "Listening...";

  recognition.onresult = function(event) {
    message.value =
      event.results[0][0].transcript;
    statusText.textContent = "Voice received";
  };

  recognition.onerror = function() {
    statusText.textContent = "Voice error";
  };
});

document.getElementById("newChat").addEventListener(
  "click",
  function() {
    chat.innerHTML = "";
    localStorage.removeItem("buddyChat");
    addMessage(
      "Hello! Welcome to Buddy AI. How can I help you today?",
      "bot"
    );
    speechSynthesis.cancel();
    statusText.textContent = "New chat started";
  }
);
</script>
</body>
</html>
