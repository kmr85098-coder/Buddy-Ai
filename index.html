
<!DOC <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamran AI Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      margin: 0;
      padding: 20px;
    }
    .chat {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
    h2 { text-align: center; }
    #messages {
      height: 350px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 12px;
    }
    .message { margin: 10px 0; overflow-wrap: anywhere; }
    input {
      width: 70%;
      padding: 12px;
      box-sizing: border-box;
    }
    button {
      padding: 12px;
      background: #087bdb;
      color: white;
      border: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat">
    <h2>My AI Chat</h2>
    <div id="messages">
      <div class="message"><b>AI:</b> Hello! How can I help you?</div>
    </div>
    <input id="messageInput" type="text" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");
      const message = input.value.trim();

      if (!message) return;

      messages.innerHTML +=
        `<div class="message"><b>You:</b> ${escapeHTML(message)}</div>`;
      input.value = "";

      const waiting = document.createElement("div");
      waiting.className = "message";
      waiting.textContent = "AI: Thinking...";
      messages.appendChild(waiting);
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch(
          "https://buddy-ai-1.onrender.com/chat",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
          }
        );

        if (!response.ok) {
          throw new Error("Server error: " + response.status);
        }

        const data = await response.json();
        waiting.textContent = "AI: " + (data.reply || "No reply received.");
      } catch (error) {
        waiting.textContent = "AI Error: " + error.message;
      }

      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("messageInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
