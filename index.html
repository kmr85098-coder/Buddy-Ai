
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1769D2">
<title>Buddy AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fff;color:#202b3c}
.app{height:100dvh;display:flex}
.sidebar{width:270px;background:#edf4ff;padding:18px;display:flex;flex-direction:column}
.logo{font-size:23px;font-weight:bold;color:#1769d2;padding:15px 5px}
.newchat{padding:13px;border:1px solid #b7d1f5;background:white;border-radius:12px;text-align:left;font-size:15px;cursor:pointer;margin:15px 0}
.history{flex:1;overflow:auto}
.history div{padding:12px;border-radius:9px;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history div:hover{background:#dceaff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:62px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #e0e8f3;color:#1769d2;font-size:21px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:20px 14px}
.welcome{text-align:center;margin:100px auto 35px}
.welcome h1{color:#1769d2;font-size:28px;margin-bottom:12px}
.welcome p{color:#718096}
.messages{max-width:780px;margin:auto}
.message{padding:13px 16px;margin:15px 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px}
.user{background:#dceaff;color:#174d91;margin-left:auto;max-width:85%}
.ai{background:#f0f5ff;color:#202b3c;max-width:100%}
.bottom{padding:14px;background:white;border-top:1px solid #e5edf7}
.inputbox{max-width:780px;margin:auto;display:flex;align-items:center;gap:8px;border:1px solid #c8daf3;border-radius:25px;padding:7px 10px}
input{flex:1;min-width:0;border:0;outline:0;padding:12px;font-size:16px}
.action{width:43px;height:43px;border:0;border-radius:50%;font-size:19px;cursor:pointer}
#mic{background:#e4f0ff;color:#1769d2}
#send{background:#1769d2;color:white}
.note{text-align:center;color:#8995a5;font-size:11px;margin-top:9px}
button:disabled{opacity:.5}
@media(max-width:650px){
.sidebar{display:none}
.welcome{margin-top:90px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">💙 Buddy AI</div>
<button class="newchat" onclick="newChat()">＋ New Chat</button>
<div class="history" id="history"></div>
</aside>

<main class="main">
<header>💙 Buddy AI</header>

<section id="chat">
<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Your friendly AI assistant</p>
</div>
<div class="messages" id="messages"></div>
</section>

<div class="bottom">
<div class="inputbox">
<input id="input" placeholder="Message Buddy AI..." autocomplete="off">
<button class="action" id="mic" type="button">🎤</button>
<button class="action" id="send" type="button">↑</button>
</div>
<p class="note">Buddy AI can make mistakes. Check important information.</p>
</div>
</main>
</div>

<script>
const API_URL="https://buddy-ai-1.onrender.com/chat";

const input=document.getElementById("input");
const messages=document.getElementById("messages");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const historyBox=document.getElementById("history");

let chatId=makeId();
let savedChats=[];

function makeId(){
return "chat-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}

function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
messages.appendChild(div);
chat.scrollTop=chat.scrollHeight;
return div;
}

function newChat(){
if(messages.children.length){
const first=messages.querySelector(".user");
if(first){
const item=document.createElement("div");
item.textContent=first.textContent.slice(0,35);
item.onclick=()=>alert("Chat history will be available after history storage is added.");
historyBox.prepend(item);
}
}
messages.innerHTML="";
welcome.style.display="block";
chatId=makeId();
input.value="";
}

async function sendMessage(){
const message=input.value.trim();
if(!message)return;

input.value="";
welcome.style.display="none";
addMessage(message,"user");

const loading=addMessage("Buddy AI is thinking...","ai");
const send=document.getElementById("send");
send.disabled=true;

try{
const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message,chatId})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Server error "+response.status);
}

if(!data.reply){
throw new Error("AI reply not received");
}

loading.textContent=data.reply;

}catch(error){
loading.textContent="Connection problem: "+error.message;
}finally{
send.disabled=false;
chat.scrollTop=chat.scrollHeight;
}
}

document.getElementById("send").onclick=sendMessage;

input.addEventListener("keydown",e=>{
if(e.key==="Enter")sendMessage();
});

document.getElementById("mic").onclick=()=>{
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Recognition){
alert("Voice recognition is not supported in this browser.");
return;
}
const recognition=new Recognition();
recognition.lang="hi-IN";
recognition.onresult=e=>{
input.value=e.results[0][0].transcript;
};
recognition.start();
};
</script>
</body>
</html>
